<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthdays - C.O.G Brass Band</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="birthdays">
    <div id="header-placeholder"></div>

    <section class="hero" style="padding: 60px 0">
      <!-- Slideshow background -->
      <div class="hero-slideshow" id="heroSlideshow">
        <div
          class="hero-slide active"
          style="background-image: url(&quot;images/hero-1.jpeg&quot;)"
        ></div>
        <div
          class="hero-slide"
          style="background-image: url(&quot;images/hero-2.jpeg&quot;)"
        ></div>
        <div
          class="hero-slide"
          style="background-image: url(&quot;images/hero-3.jpeg&quot;)"
        ></div>
        <div
          class="hero-slide"
          style="background-image: url(&quot;images/hero-4.jpg&quot;)"
        ></div>
      </div>

      <!-- Dots indicator -->
      <div
        id="heroDots"
        style="
          position: absolute;
          bottom: 30px;
          left: 50%;
          transform: translateX(-50%);
          display: flex;
          gap: 10px;
          z-index: 3;
        "
      ></div>

      <div class="container">
        <div class="hero-content">
          <div class="hero-badge">
            <i class="fas fa-birthday-cake"></i> Celebrations
          </div>
          <h2>🎂 Celebrating Our Members</h2>
          <p>Honouring our band family on their special days</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="currentMonthCelebrations"></div>

        <div class="section-header" style="margin-top: 48px">
          <h2>All Birthdays</h2>
          <p>Band members and their special days</p>
        </div>
        <div class="card-grid" id="birthdayList">
          <div class="spinner" style="grid-column: 1/-1"></div>
        </div>
      </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/main.js"></script>

    <script>
      async function loadBirthdays() {
        const container = document.getElementById("birthdayList");
        const celebrationContainer = document.getElementById(
          "currentMonthCelebrations",
        );

        try {
          const snapshot = await db.ref("users").once("value");
          const users = snapshot.val();

          if (!users) {
            container.innerHTML =
              '<div class="empty-state" style="grid-column: 1/-1;"><i class="fas fa-birthday-cake"></i><h3>No birthdays yet</h3></div>';
            return;
          }

          const activeUsers = Object.values(users).filter(
            (u) => u.birthDate && u.status === "active",
          );
          const currentMonth = new Date().getMonth();
          const currentMonthName = new Date().toLocaleString("en-ZA", {
            month: "long",
          });

          // Current month celebrations
          const currentMonthBirthdays = activeUsers.filter(
            (u) => new Date(u.birthDate).getMonth() === currentMonth,
          );

          if (currentMonthBirthdays.length > 0) {
            celebrationContainer.innerHTML = `
                        <div class="section-header">
                            <h2>🎉 ${currentMonthName} Celebrations</h2>
                            <p>Happy Birthday to our beloved band members!</p>
                        </div>
                        <div class="card-grid">
                            ${currentMonthBirthdays
                              .map((user) => {
                                const isToday = isBirthdayToday(user.birthDate);
                                return `
                                    <div class="birthday-card ${isToday ? "today" : ""}">
                                        <div class="birthday-avatar">
                                            ${
                                              user.photoURL
                                                ? `<img src="${user.photoURL}" alt="${user.name}">`
                                                : user.name
                                                    .charAt(0)
                                                    .toUpperCase()
                                            }
                                        </div>
                                        <h3 style="font-size: 1.15rem;">${user.name}</h3>
                                        <p style="font-size: 0.9rem; color: var(--text-light);">${user.instrument || "Musician"}</p>
                                        <p style="color: var(--gold); font-weight: 600; margin-top: 8px;">
                                            <i class="fas fa-birthday-cake"></i> ${getDayOfMonth(user.birthDate)} ${currentMonthName}
                                        </p>
                                        ${isToday ? '<p style="color: var(--success); font-weight: 600; margin-top: 8px; font-size: 1.1rem;">🎉 TODAY! 🎉</p>' : ""}
                                    </div>
                                `;
                              })
                              .join("")}
                        </div>
                    `;
          }

          // All birthdays sorted by month/day
          const sortedUsers = activeUsers.sort((a, b) => {
            const dateA = new Date(a.birthDate);
            const dateB = new Date(b.birthDate);
            if (dateA.getMonth() !== dateB.getMonth())
              return dateA.getMonth() - dateB.getMonth();
            return dateA.getDate() - dateB.getDate();
          });

          container.innerHTML = sortedUsers
            .map((user) => {
              const isToday = isBirthdayToday(user.birthDate);
              const birthDate = new Date(user.birthDate);
              const isThisMonth = birthDate.getMonth() === currentMonth;

              return `
                        <div class="birthday-card ${isToday ? "today" : ""}" style="${isThisMonth && !isToday ? "border-color: var(--gold-light);" : ""}">
                            <div class="birthday-avatar">
                                ${
                                  user.photoURL
                                    ? `<img src="${user.photoURL}" alt="${user.name}">`
                                    : user.name.charAt(0).toUpperCase()
                                }
                            </div>
                            <h3 style="font-size: 1.1rem;">${user.name}</h3>
                            <p style="font-size: 0.9rem; color: var(--text-light);">${user.instrument || "Musician"}</p>
                            <p style="color: var(--gold); font-weight: 600; margin-top: 8px;">
                                <i class="fas fa-birthday-cake"></i> ${getDayOfMonth(user.birthDate)} ${getMonthName(user.birthDate)}
                            </p>
                        </div>
                    `;
            })
            .join("");
        } catch (e) {
          console.error(e);
          container.innerHTML =
            '<div class="empty-state" style="grid-column: 1/-1;"><h3>Birthdays unavailable</h3></div>';
        }
      }

      document.addEventListener("DOMContentLoaded", loadBirthdays);

      // ============================================
      // HERO SLIDESHOW
      // ============================================
      (function initHeroSlideshow() {
        const slides = document.querySelectorAll(".hero-slide");
        const dotsContainer = document.getElementById("heroDots");
        if (slides.length === 0 || !dotsContainer) return;

        let current = 0;
        let interval;

        // Create dots
        slides.forEach((_, i) => {
          const dot = document.createElement("button");
          dot.style.cssText = `width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; background: ${i === 0 ? "white" : "transparent"}; cursor: pointer; padding: 0; transition: all 0.3s;`;
          dot.setAttribute("aria-label", `Go to slide ${i + 1}`);
          dot.onclick = () => goToSlide(i);
          dotsContainer.appendChild(dot);
        });

        const dots = dotsContainer.querySelectorAll("button");

        function goToSlide(index) {
          slides[current].classList.remove("active");
          dots[current].style.background = "transparent";
          current = index;
          slides[current].classList.add("active");
          dots[current].style.background = "white";
          clearInterval(interval);
          interval = setInterval(nextSlide, 5000);
        }

        function nextSlide() {
          goToSlide((current + 1) % slides.length);
        }

        interval = setInterval(nextSlide, 5000);
      })();
    </script>
  </body>
</html>
