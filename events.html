<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events - C.O.G Brass Band</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="events">
    <div id="header-placeholder"></div>

    <section class="hero" style="padding: 60px 0">
      <!-- Slideshow background -->
      <div class="hero-slideshow" id="heroSlideshow">
        <div
          class="hero-slide active"
          style="background-image: url(&quot;images/hero-1.jpeg&quot;)"
        ></div>
        <div
          class="hero-slide"
          style="background-image: url(&quot;images/hero-2.jpeg&quot;)"
        ></div>
        <div
          class="hero-slide"
          style="background-image: url(&quot;images/hero-3.jpeg&quot;)"
        ></div>
        <div
          class="hero-slide"
          style="background-image: url(&quot;images/hero-4.jpg&quot;)"
        ></div>
      </div>

      <!-- Dots indicator -->
      <div
        id="heroDots"
        style="
          position: absolute;
          bottom: 30px;
          left: 50%;
          transform: translateX(-50%);
          display: flex;
          gap: 10px;
          z-index: 3;
        "
      ></div>

      <div class="container">
        <div class="hero-content">
          <div class="hero-badge"><i class="fas fa-calendar"></i> Events</div>
          <h2>Upcoming Events</h2>
          <p>Join us at our next worship service or performance</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="card-grid" id="eventsList">
          <div class="spinner" style="grid-column: 1/-1"></div>
        </div>
      </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/main.js"></script>

    <script>
      async function loadEvents() {
        const container = document.getElementById("eventsList");
        try {
          const snapshot = await db.ref("events").once("value");
          const events = snapshot.val();

          if (!events) {
            container.innerHTML =
              '<div class="empty-state" style="grid-column: 1/-1;"><i class="fas fa-calendar"></i><h3>No upcoming events</h3><p>Check back soon for updates!</p></div>';
            return;
          }

          // Filter out past events
          const today = new Date();
          today.setHours(0, 0, 0, 0);

          const upcomingEvents = Object.values(events)
            .filter((event) => {
              if (!event.date) return false;
              const eventDate = new Date(event.date);
              eventDate.setHours(0, 0, 0, 0);
              return eventDate >= today;
            })
            .sort((a, b) => new Date(a.date) - new Date(b.date));

          if (upcomingEvents.length === 0) {
            container.innerHTML =
              '<div class="empty-state" style="grid-column: 1/-1;"><i class="fas fa-calendar"></i><h3>No upcoming events</h3><p>Check back soon for updates!</p></div>';
            return;
          }

          container.innerHTML = upcomingEvents
            .map(
              (event) => `
                <div class="event-card">
                    ${
                      event.poster
                        ? `
                        <div style="height: 220px; overflow: hidden; background: var(--gray-100);">
                            <img src="${event.poster}" alt="${event.title}" 
                                 style="width: 100%; height: 100%; object-fit: cover;"
                                 onerror="this.parentElement.style.display='none'">
                        </div>
                    `
                        : ""
                    }
                    <div class="event-date-bar">
                        <i class="fas fa-calendar"></i> ${formatDate(event.date)}
                    </div>
                    <div class="event-body">
                        <h3>${event.title}</h3>
                        <p>${event.description || ""}</p>
                        <p class="event-meta"><i class="fas fa-clock"></i> ${event.time || "TBA"}</p>
                        <p class="event-meta"><i class="fas fa-map-marker-alt"></i> ${event.location || "TBA"}</p>
                    </div>
                </div>
            `,
            )
            .join("");
        } catch (e) {
          console.error(e);
          container.innerHTML =
            '<div class="empty-state" style="grid-column: 1/-1;"><h3>Events unavailable</h3></div>';
        }
      }

      document.addEventListener("DOMContentLoaded", loadEvents);

      // ============================================
      // HERO SLIDESHOW
      // ============================================
      (function initHeroSlideshow() {
        const slides = document.querySelectorAll(".hero-slide");
        const dotsContainer = document.getElementById("heroDots");
        if (slides.length === 0 || !dotsContainer) return;

        let current = 0;
        let interval;

        // Create dots
        slides.forEach((_, i) => {
          const dot = document.createElement("button");
          dot.style.cssText = `width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; background: ${i === 0 ? "white" : "transparent"}; cursor: pointer; padding: 0; transition: all 0.3s;`;
          dot.setAttribute("aria-label", `Go to slide ${i + 1}`);
          dot.onclick = () => goToSlide(i);
          dotsContainer.appendChild(dot);
        });

        const dots = dotsContainer.querySelectorAll("button");

        function goToSlide(index) {
          slides[current].classList.remove("active");
          dots[current].style.background = "transparent";
          current = index;
          slides[current].classList.add("active");
          dots[current].style.background = "white";
          clearInterval(interval);
          interval = setInterval(nextSlide, 5000);
        }

        function nextSlide() {
          goToSlide((current + 1) % slides.length);
        }

        interval = setInterval(nextSlide, 5000);
      })();
    </script>
  </body>
</html>
